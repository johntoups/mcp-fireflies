[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-fireflies"
version = "0.1.0"
description = "MCP server for Fireflies.ai meeting transcripts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "John Toups" }
]
keywords = ["mcp", "fireflies", "meetings", "transcripts", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
mcp-fireflies = "mcp_fireflies.server:main"
fireflies-auth = "mcp_fireflies.cli:main_auth"
fireflies-sync = "mcp_fireflies.cli:main_sync"

[project.urls]
Homepage = "https://github.com/johntoups/mcp-fireflies"
Repository = "https://github.com/johntoups/mcp-fireflies"
Issues = "https://github.com/johntoups/mcp-fireflies/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fireflies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
